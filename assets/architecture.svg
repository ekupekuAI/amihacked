<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="Architecture: a live Windows machine and evidence files feed fixed read-only collectors, which fill a case store of evidence with IDs and hashes. Detection rules and the AI agent both read the store. The agent can submit findings only if they cite evidence IDs. The result is a verdict, findings, timeline and report.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34f5c5"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .t { fill: #e6edf6; font-size: 16px; font-weight: 600; }
      .s { fill: #8494aa; font-size: 12.5px; }
      .cap { fill: #6f7f95; font-size: 11.5px; letter-spacing: 1.5px; font-weight: 600; }
      .lbl { fill: #9ff8e2; font-size: 12px; }
      .box { fill: #0d1420; stroke: #2b3b52; }
      .hot { fill: #0d1420; stroke: #34f5c5; }
      .flow { fill: none; stroke: #34f5c5; stroke-width: 1.6; stroke-dasharray: 5 6; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -22; } }
      @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    </style>
  </defs>

  <rect width="1000" height="420" rx="14" fill="#0a0f17"/>
  <rect x="0.5" y="0.5" width="999" height="419" rx="14" fill="none" stroke="#223043"/>

  <!-- inputs -->
  <text class="cap" x="30" y="92">INPUTS</text>
  <rect class="box" x="30" y="108" width="200" height="72" rx="10"/>
  <text class="t" x="48" y="140">Live machine</text>
  <text class="s" x="48" y="160">Windows, read-only</text>
  <rect class="box" x="30" y="240" width="200" height="72" rx="10"/>
  <text class="t" x="48" y="272">Evidence files</text>
  <text class="s" x="48" y="292">evtx · pcap · SSH and web logs</text>

  <!-- engine -->
  <rect x="290" y="40" width="400" height="340" rx="14" fill="#34f5c5" fill-opacity="0.04" stroke="#34f5c5" stroke-opacity="0.35"/>
  <text class="cap" x="312" y="66" style="fill:#34f5c5">AMIHACKED</text>
  <rect class="box" x="320" y="82" width="340" height="64" rx="10"/>
  <text class="t" x="340" y="110">Collectors and readers</text>
  <text class="s" x="340" y="130">Fixed scripts and parsers. Nothing the agent supplies is run.</text>
  <rect class="hot" x="320" y="180" width="340" height="64" rx="10"/>
  <text class="t" x="340" y="208">Case store</text>
  <text class="s" x="340" y="228">Evidence records, each with an ID and a SHA-256</text>
  <rect class="box" x="320" y="278" width="340" height="64" rx="10"/>
  <text class="t" x="340" y="306">23 detection rules</text>
  <text class="s" x="340" y="326">MITRE ATT&amp;CK technique, confidence, innocent explanation</text>

  <!-- agent and output -->
  <rect class="box" x="760" y="82" width="210" height="72" rx="10"/>
  <text class="t" x="778" y="112">AI agent</text>
  <text class="s" x="778" y="132">Claude Code, Codex, Cursor...</text>
  <text class="lbl" x="760" y="178">searches and reads evidence</text>
  <text class="lbl" x="760" y="196">submit_finding must cite real IDs</text>

  <rect class="hot" x="760" y="278" width="210" height="72" rx="10"/>
  <text class="t" x="778" y="308">Verdict and report</text>
  <text class="s" x="778" y="328">Findings · timeline · coverage</text>

  <!-- flows -->
  <g marker-end="url(#arrow)">
    <path class="flow" d="M230 144C276 144 274 108 318 108"/>
    <path class="flow" d="M230 276C282 276 268 122 318 122"/>
    <path class="flow" d="M490 146V178"/>
    <path class="flow" d="M490 244V276"/>
    <path class="flow" d="M660 310H758"/>
  </g>
  <path class="flow" d="M662 212C716 212 706 118 758 118" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
</svg>
