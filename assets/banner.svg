<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="amihacked: ask your AI agent, am I hacked? Evidence-backed investigation for AI agents.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#34f5c5" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#34f5c5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9ff8e2"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34f5c5" stop-opacity="0"/>
      <stop offset="1" stop-color="#34f5c5" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1b2636" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="20"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .spin { transform-origin: 930px 190px; animation: spin 6s linear infinite; }
      .ring { transform-origin: 930px 190px; animation: pulse 4s ease-out infinite; }
      .ring.b { animation-delay: 2s; }
      .blip { animation: blip 6s linear infinite; }
      .blip.b { animation-delay: 1.9s; }
      .blip.c { animation-delay: 4.1s; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .rise { animation: rise 0.9s ease-out both; }
      .rise.d1 { animation-delay: 0.15s; }
      .rise.d2 { animation-delay: 0.3s; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0% { transform: scale(0.35); opacity: 0.7; } 100% { transform: scale(1.25); opacity: 0; } }
      @keyframes blip { 0%, 8% { opacity: 1; } 45%, 100% { opacity: 0.12; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .spin, .ring, .blip, .cursor, .rise { animation: none; }
        .ring { opacity: 0; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)" opacity="0.7"/>
    <rect width="1200" height="380" fill="url(#glow)"/>

    <!-- radar -->
    <g fill="none" stroke="#34f5c5">
      <circle cx="930" cy="190" r="150" stroke-opacity="0.16"/>
      <circle cx="930" cy="190" r="100" stroke-opacity="0.2"/>
      <circle cx="930" cy="190" r="50" stroke-opacity="0.26"/>
      <path d="M780 190H1080M930 40V340" stroke-opacity="0.12"/>
      <circle class="ring" cx="930" cy="190" r="150" stroke-opacity="0.5"/>
      <circle class="ring b" cx="930" cy="190" r="150" stroke-opacity="0.5"/>
    </g>
    <g class="spin">
      <path d="M930 190 L1080 190 A150 150 0 0 0 1036 84 Z" fill="url(#sweep)" opacity="0.5"/>
      <path d="M930 190H1080" stroke="#34f5c5" stroke-width="2"/>
    </g>
    <circle class="blip" cx="1010" cy="130" r="5" fill="#ff5d73"/>
    <circle class="blip b" cx="865" cy="255" r="4" fill="#ffc857"/>
    <circle class="blip c" cx="975" cy="270" r="4" fill="#34f5c5"/>
    <circle cx="930" cy="190" r="4" fill="#34f5c5"/>

    <!-- copy -->
    <g class="rise">
      <rect x="72" y="74" width="212" height="30" rx="15" fill="#34f5c5" fill-opacity="0.1" stroke="#34f5c5" stroke-opacity="0.35"/>
      <circle cx="92" cy="89" r="4" fill="#34f5c5"/>
      <text x="106" y="94" class="mono" font-size="13" fill="#9ff8e2" letter-spacing="0.5">MCP SERVER + CLI</text>
    </g>
    <text class="sans rise d1" x="70" y="178" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-2.5">amihacked</text>
    <g class="rise d2">
      <text x="72" y="226" class="sans" font-size="25" fill="#c9d4e3">Ask your AI agent: “Am I hacked?”</text>
      <text x="72" y="262" class="sans" font-size="17" fill="#7f8ea3">Evidence-backed investigation of a live machine or evidence files.</text>
      <g class="mono" font-size="15">
        <rect x="72" y="292" width="382" height="40" rx="10" fill="#0a0f17" stroke="#223043"/>
        <text x="90" y="317" fill="#34f5c5">$</text>
        <text x="108" y="317" fill="#e6edf6">amihacked scan --report case.md</text>
        <rect class="cursor" x="392" y="303" width="9" height="18" fill="#34f5c5"/>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="20" fill="none" stroke="#223043"/>
</svg>
